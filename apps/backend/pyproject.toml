[project]
name = "image-archive-chat-backend"
version = "0.1.0"
description = "FastAPI backend for image archiving, search, chat, and OpenAI image generation."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.0",
  "psycopg[binary]>=3.2.0",
  "pgvector>=0.3.0",
  "pydantic-settings>=2.4.0",
  "python-multipart>=0.0.9",
  "pillow>=10.4.0",
  "openai>=2.0.0",
  "alembic>=1.13.0",
]

[tool.uvicorn]
factory = false

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.0.0",
]
